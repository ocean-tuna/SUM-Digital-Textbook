" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169" x="128.5" y="117.1045">HeartBeat received with value</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202" x="132.5" y="133.4561">greater than Power Down threshold</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67" x="132.5" y="149.8076">(2^32 - 256)</text><polygon fill="#A80036" points="561.5,230.0703,571.5,234.0703,561.5,238.0703,565.5,234.0703" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="355.5" x2="567.5" y1="234.0703" y2="234.0703"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176" x="362.5" y="180.1592">HeartBeat NOT received within</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142" x="366.5" y="196.5107">DTC timeout length AND</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133" x="366.5" y="212.8623">device is not monitored</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190" x="366.5" y="229.2139">(!IsRequested AND !IsRequester)</text><!--MD5=[2427dbb684a30b4c2544b39d1d4f0c7d]
@startuml

actor RemoteState

participant On
participant Pending_Shutdown
participant Off

On -> Pending_Shutdown : HeartBeat received with value \n greater than Power Down threshold \n (2^32 - 256)
Pending_Shutdown -> Off : HeartBeat NOT received within \n DTC timeout length AND \n device is not monitored \n (!IsRequested AND !IsRequester)

@enduml

