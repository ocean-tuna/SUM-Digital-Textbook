[package]
name = "spm-rust-implementation"
version = "1.0.0"
edition = "2021"
authors = ["SPM Team"]
description = "Software Profile Manager (SPM) implementation in Rust based on object-oriented design"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/spm-rust"
documentation = "https://docs.rs/spm-rust-implementation"
keywords = ["automotive", "power-management", "profile-manager", "embedded"]
categories = ["embedded", "network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Networking
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Collections and utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
dashmap = "5.0"

[dev-dependencies]
# Testing
tokio-test = "0.4"
criterion = "0.5"

[[example]]
name = "spm_basic_usage"
path = "spm_rust_example.rs"

[[bench]]
name = "spm_performance"
harness = false

[features]
default = ["std"]
std = []
no-std = ["embedded-hal"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
overflow-checks = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
