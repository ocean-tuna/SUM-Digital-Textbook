<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTA-SUM SWC Diagrams</title>
<style>
  :root {
    --primary: #1a5276;
    --primary-dark: #0e2f44;
    --accent: #e67e22;
    --sr-color: #2ecc71;
    --cs-color: #3498db;
    --ms-color: #9b59b6;
    --irv-color: #e74c3c;
    --runnable-bg: #fef9e7;
    --dim: 0.2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f3f7; color: #2c3e50; line-height: 1.5; }

  /* Header */
  .page-header {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #fff; padding: 16px 32px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .page-header h1 { font-size: 1.2rem; font-weight: 700; }
  .page-header h1 span { color: var(--accent); }
  .legend { display: flex; gap: 14px; font-size: 0.72rem; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

  /* Nav */
  .nav-bar {
    background: #1e2a3a; padding: 8px 32px;
    display: flex; gap: 4px; flex-wrap: wrap;
    position: sticky; top: 56px; z-index: 99;
  }
  .nav-btn {
    background: rgba(255,255,255,0.08); color: #b8c9d9; border: none;
    padding: 6px 14px; border-radius: 4px; cursor: pointer;
    font-size: 0.78rem; font-weight: 600; transition: all 0.15s;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .nav-btn.active { background: var(--accent); color: #fff; }

  .main { max-width: 1600px; margin: 0 auto; padding: 24px; }

  /* Module Section */
  .module-section { margin-bottom: 28px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
  .module-title-bar {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; padding: 12px 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; user-select: none;
  }
  .module-title-bar:hover { filter: brightness(1.1); }
  .module-title-bar h2 { font-size: 1.1rem; }
  .module-title-bar .tag {
    background: var(--accent); color: #fff; padding: 2px 10px;
    border-radius: 4px; font-size: 0.73rem; font-weight: 700; margin-right: 12px;
  }
  .module-title-bar .arrow { font-size: 0.8rem; transition: transform 0.3s; }
  .module-title-bar.open .arrow { transform: rotate(90deg); }
  .module-body { display: none; padding: 24px; }
  .module-body.open { display: block; }
  .module-info {
    font-size: 0.88rem; color: #7f8c8d; margin-bottom: 16px;
    padding: 10px 14px; background: #f8f9fa; border-radius: 6px; border-left: 3px solid var(--accent);
  }
  .module-info strong { color: #2c3e50; }

  /* Hint bar */
  .hint-bar {
    font-size: 0.82rem; color: #95a5a6; text-align: center;
    padding: 8px; margin-bottom: 12px; border: 1px dashed #d5dbdb; border-radius: 6px;
    background: #fdfefe;
  }
  .hint-bar em { color: var(--accent); font-style: normal; font-weight: 600; }

  /* SWC Diagram */
  .swc-diagram { display: flex; gap: 0; align-items: stretch; min-height: 300px; }
  .port-col {
    width: 340px; flex-shrink: 0; display: flex; flex-direction: column;
    gap: 4px; padding: 10px 0; justify-content: center;
  }
  .port-col.left { align-items: flex-end; }
  .port-col.right { align-items: flex-start; }
  .port-section-label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px;
    color: #7f8c8d; font-weight: 700; padding: 6px 8px; text-align: center; width: 100%;
  }
  .port-col.left .port-section-label { text-align: right; }
  .port-col.right .port-section-label { text-align: left; }

  /* Port item */
  .port-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.82rem; white-space: nowrap; max-width: 340px;
    transition: opacity 0.25s, transform 0.15s;
    cursor: pointer; position: relative;
  }
  .port-item.dimmed { opacity: var(--dim); }
  .port-item:hover { transform: scale(1.03); }
  .port-col.left .port-item { flex-direction: row-reverse; }
  .port-label {
    padding: 4px 10px; border-radius: 5px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; max-width: 280px;
  }
  .port-item:hover .port-label, .port-item.highlighted .port-label {
    max-width: none; z-index: 10; position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .port-label.sr { background: #d5f5e3; color: #1e8449; border: 1px solid #a9dfbf; }
  .port-label.cs { background: #d6eaf8; color: #1a5276; border: 1px solid #aed6f1; }
  .port-label.ms { background: #e8daef; color: #6c3483; border: 1px solid #d2b4de; }
  .port-item.highlighted .port-label.sr { background: #a9dfbf; box-shadow: 0 0 0 2px #27ae60; }
  .port-item.highlighted .port-label.cs { background: #aed6f1; box-shadow: 0 0 0 2px #2980b9; }
  .port-item.highlighted .port-label.ms { background: #d2b4de; box-shadow: 0 0 0 2px #8e44ad; }
  .port-connector { width: 24px; height: 2px; position: relative; flex-shrink: 0; }
  .port-connector.rp { background: #e74c3c; }
  .port-connector.pp { background: #27ae60; }
  .port-connector.rp::after {
    content: ''; position: absolute; right: -1px; top: -5px;
    border: 6px solid transparent; border-left: 7px solid #e74c3c;
  }
  .port-connector.pp::after {
    content: ''; position: absolute; right: -1px; top: -5px;
    border: 6px solid transparent; border-left: 7px solid #27ae60;
  }
  .port-col.left .port-connector.rp::after {
    right: auto; left: -1px; border-left: none; border-right: 7px solid #e74c3c;
  }
  .port-type-badge {
    font-size: 0.65rem; padding: 2px 6px; border-radius: 3px;
    font-weight: 700; flex-shrink: 0;
  }
  .badge-sr { background: var(--sr-color); color: #fff; }
  .badge-cs { background: var(--cs-color); color: #fff; }
  .badge-ms { background: var(--ms-color); color: #fff; }

  /* SWC Block */
  .swc-block {
    flex: 1; border: 3px solid var(--primary); border-radius: 8px;
    background: #fafcfe; display: flex; flex-direction: column; min-width: 320px;
  }
  .swc-block-header {
    background: var(--primary); color: #fff; padding: 10px 16px;
    font-weight: 700; font-size: 1.05rem; text-align: center; border-radius: 5px 5px 0 0;
  }
  .swc-block-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 10px; }

  /* Runnables */
  .runnables-section h4, .irv-section h4 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
    color: #7f8c8d; margin-bottom: 6px;
  }
  .runnable-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px; background: var(--runnable-bg); border-radius: 5px;
    border-left: 4px solid var(--accent); font-size: 0.84rem;
    margin-bottom: 4px; cursor: pointer; transition: all 0.2s;
    user-select: none;
  }
  .runnable-item:hover { background: #fcf3cf; transform: translateX(3px); }
  .runnable-item.active {
    background: #f9e79f; border-left-color: #d35400;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .runnable-item.dimmed { opacity: var(--dim); }
  .runnable-name { font-weight: 600; color: #2c3e50; flex: 1; }
  .runnable-info-btn {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #3b82f6;
    background: #eff6ff; color: #3b82f6; font-size: 12px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s; line-height: 1; font-family: Georgia, serif;
  }
  .runnable-info-btn:hover { background: #3b82f6; color: #fff; transform: scale(1.15); }
  .runnable-trigger {
    font-size: 0.72rem; padding: 2px 8px; border-radius: 3px; font-weight: 600; white-space: nowrap;
  }
  .trigger-periodic { background: #d5f5e3; color: #1e8449; }
  .trigger-init { background: #fdebd0; color: #b7950b; }
  .trigger-event { background: #fadbd8; color: #922b21; }
  .trigger-cs { background: #d6eaf8; color: #1a5276; }

  /* IRV */
  .irv-section { margin-top: 8px; padding-top: 10px; border-top: 1px dashed #bdc3c7; }
  .irv-section h4 { color: var(--irv-color); }
  .irv-item {
    display: inline-block; padding: 3px 10px; background: #fdedec;
    border: 1px solid #f5b7b1; border-radius: 4px; font-size: 0.78rem;
    color: #922b21; margin: 2px 3px; font-weight: 500;
  }

  /* Detail Panel (port info popup) */
  .detail-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3); z-index: 500;
  }
  .detail-overlay.show { display: flex; align-items: center; justify-content: center; }
  .detail-panel {
    background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    max-width: 580px; width: 92%; max-height: 80vh; overflow-y: auto;
    padding: 0; position: relative;
  }
  .detail-panel-header {
    padding: 14px 20px; border-radius: 12px 12px 0 0;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 2;
  }
  .detail-panel-header.sr-header { background: #d5f5e3; border-bottom: 2px solid #27ae60; }
  .detail-panel-header.cs-header { background: #d6eaf8; border-bottom: 2px solid #2980b9; }
  .detail-panel-header.ms-header { background: #e8daef; border-bottom: 2px solid #8e44ad; }
  .detail-panel-header h3 { font-size: 1.05rem; color: #2c3e50; }
  .detail-close {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.1); color: #2c3e50; font-size: 1.1rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .detail-close:hover { background: rgba(0,0,0,0.2); }
  .detail-body { padding: 16px 20px; }
  .detail-row {
    display: flex; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid #f2f3f4; font-size: 0.9rem;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { font-weight: 700; color: #7f8c8d; width: 120px; flex-shrink: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .detail-value { color: #2c3e50; flex: 1; }
  .detail-tag {
    display: inline-block; padding: 3px 10px; border-radius: 4px;
    font-size: 0.82rem; font-weight: 600;
  }
  .detail-tag.sr-tag { background: #d5f5e3; color: #1e8449; }
  .detail-tag.cs-tag { background: #d6eaf8; color: #1a5276; }
  .detail-tag.ms-tag { background: #e8daef; color: #6c3483; }
  .detail-tag.rp-tag { background: #fadbd8; color: #922b21; }
  .detail-tag.pp-tag { background: #d5f5e3; color: #1e8449; }
  .detail-runnables-list { margin-top: 4px; }
  .detail-runnables-list .mini-runnable {
    display: inline-block; padding: 3px 10px; margin: 2px;
    background: var(--runnable-bg); border: 1px solid #f0d78c;
    border-radius: 4px; font-size: 0.8rem; font-weight: 500; color: #7d6608;
  }

  /* Reset filter button */
  .reset-filter-btn {
    display: none; margin: 0 auto 10px; padding: 6px 20px;
    background: var(--accent); color: #fff; border: none; border-radius: 5px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .reset-filter-btn.show { display: block; }
  .reset-filter-btn:hover { filter: brightness(1.1); }

  /* Subgroup Tabs */
  .subgroup-tabs {
    display: flex; gap: 4px; justify-content: center; margin-bottom: 14px;
    padding: 6px; background: #eef2f7; border-radius: 8px;
  }
  .subgroup-tab {
    padding: 6px 18px; border: 2px solid transparent; border-radius: 6px;
    font-size: 0.82rem; font-weight: 700; cursor: pointer;
    background: #fff; color: #7f8c8d; transition: all 0.2s;
  }
  .subgroup-tab:hover { color: var(--primary); border-color: #bdc3c7; }
  .subgroup-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .subgroup-tab .tab-badge {
    display: inline-block; font-size: 0.68rem; padding: 1px 6px;
    border-radius: 10px; margin-left: 5px; font-weight: 600;
  }
  .subgroup-tab.active .tab-badge { background: rgba(255,255,255,0.3); color: #fff; }
  .subgroup-tab:not(.active) .tab-badge { background: #e8e8e8; color: #777; }
  .sg-badge {
    font-size: 0.62rem; padding: 1px 6px; border-radius: 3px;
    font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; flex-shrink: 0;
  }
  .sg-ssm { background: #d1ecf1; color: #0c5460; }
  .sg-errh { background: #f8d7da; color: #721c24; }
  .sg-both { background: #e2e3e5; color: #383d41; }

  /* Runnable Info Popup */
  .ri-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:600; justify-content:center; align-items:center; }
  .ri-overlay.show { display:flex; }
  .ri-popup { background:#fff; border-radius:10px; box-shadow:0 8px 32px rgba(0,0,0,0.25); max-width:680px; width:92vw; max-height:82vh; overflow-y:auto; animation:riPopIn .2s ease-out; }
  @keyframes riPopIn { from{transform:scale(.92);opacity:0} to{transform:scale(1);opacity:1} }
  .ri-header { background:linear-gradient(135deg,#1e3a5f,#1a56db); color:#fff; padding:14px 20px 12px; border-radius:10px 10px 0 0; display:flex; justify-content:space-between; align-items:flex-start; }
  .ri-header h3 { margin:0; font-size:15px; font-weight:700; word-break:break-all; }
  .ri-close { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; line-height:1; padding:0 0 0 12px; opacity:.8; }
  .ri-close:hover { opacity:1; }
  .ri-body { padding:16px 20px 20px; }
  .ri-body table { width:100%; border-collapse:collapse; font-size:13px; }
  .ri-body th { text-align:left; padding:7px 10px; background:#f0f4ff; color:#1e3a5f; font-weight:600; border-bottom:1px solid #e2e8f0; white-space:nowrap; width:150px; vertical-align:top; }
  .ri-body td { padding:7px 10px; border-bottom:1px solid #f1f5f9; color:#334155; vertical-align:top; }
  .ri-body td code { background:#f1f5f9; padding:1px 5px; border-radius:3px; font-size:12px; }
  .ri-body ul { margin:2px 0; padding-left:18px; }
  .ri-body ul li { margin:2px 0; font-size:12.5px; }
  .ri-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
  .ri-b-timing { background:#dbeafe; color:#1e40af; }
  .ri-b-datarcv { background:#d1fae5; color:#065f46; }
  .ri-b-opinvoke { background:#fef3c7; color:#92400e; }
  .ri-b-mode { background:#ede9fe; color:#5b21b6; }
  .ri-b-init { background:#e0e7ff; color:#3730a3; }

  @media (max-width: 1200px) {
    .swc-diagram { flex-direction: column; align-items: center; }
    .port-col { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 8px; }
    .port-col.left .port-item { flex-direction: row; }
    .port-connector { display: none; }
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>RTA-<span>SUM</span> &mdash; SWC Component Diagrams</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#d5f5e3;border:1px solid #a9dfbf;"></div> S/R Port</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d6eaf8;border:1px solid #aed6f1;"></div> C/S Port</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e8daef;border:1px solid #d2b4de;"></div> Mode-Switch</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e74c3c;"></div> R-Port (In)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#27ae60;"></div> P-Port (Out)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--runnable-bg);border:1px solid #f0d78c;"></div> Runnable</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fdedec;border:1px solid #f5b7b1;"></div> IRV</div>
  </div>
</div>
<div class="nav-bar" id="navBar"></div>

<!-- Detail Overlay -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-panel" id="detailPanel" onclick="event.stopPropagation()">
    <div class="detail-panel-header" id="detailHeader">
      <h3 id="detailTitle"></h3>
      <button class="detail-close" onclick="closeDetail()">&times;</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- Runnable Info Overlay -->
<div class="ri-overlay" id="riOverlay">
  <div class="ri-popup" onclick="event.stopPropagation()">
    <div class="ri-header">
      <h3 id="riTitle"></h3>
      <button class="ri-close" id="riClose">&times;</button>
    </div>
    <div class="ri-body" id="riBody"></div>
  </div>
</div>

<div class="main" id="mainContent"></div>

<script>
// =========================================================================
// DATA MODEL - Each module defines: runnables, ports, IRVs, and links
// =========================================================================
const MODULES = [
// ------ SUSD ------
{
  id: 'mod-susd', tag: 'SUSD', name: 'Start Up / Shut Down Coordinator',
  swcName: 'SUM_SUSD', layer: 'Application',
  desc: 'Centralized ECU lifecycle manager. Controls startup sequencing, shutdown voting, battery voltage classification, and vehicle power mode determination for all SUM modules.',
  runnables: [
    { id:'susd_init', name:'RE_SUSD_Init', trigger:'init', triggerLabel:'INIT', ports:['susd_rp1','susd_pp1','susd_pp2','susd_pp3','susd_pp4','susd_pp5','susd_pp6','susd_pp7','susd_pp8','susd_pp9'] },
    { id:'susd_app', name:'RE_SUSD_AppStateManager', trigger:'periodic', triggerLabel:'PERIODIC', ports:['susd_rp2','susd_rp3','susd_rp4','susd_rp5','susd_rp6','susd_rp7','susd_rp8','susd_rp9','susd_rp10','susd_rp11','susd_pp1','susd_pp2','susd_pp3','susd_pp4','susd_pp5','susd_pp6','susd_pp7','susd_pp8','susd_pp9','susd_pp10'] },
    { id:'susd_batt', name:'RE_SUSD_BatteryNotifications', trigger:'periodic', triggerLabel:'PERIODIC', ports:['susd_rp1','susd_pp11','susd_pp12'] },
    { id:'susd_vpm', name:'RE_SUSD_VehiclePowerMode', trigger:'periodic', triggerLabel:'PERIODIC', ports:['susd_rp12','susd_rp13','susd_rp14','susd_pp13'] },
    { id:'susd_rc', name:'RE_SUSD_RunCrankManagement', trigger:'periodic', triggerLabel:'PERIODIC', ports:['susd_rp14'] },
    { id:'susd_timer', name:'RE_Manage_RESETExecution_TIMER', trigger:'periodic', triggerLabel:'PERIODIC', ports:['susd_rp15'] },
    { id:'susd_ar', name:'RE_SUSD_ActivityRecord_Handler', trigger:'periodic', triggerLabel:'PERIODIC', ports:['susd_rp16','susd_pp14'] },
    { id:'susd_reprg', name:'RE_SUSD_DiagReprogrammingReq', trigger:'event', triggerLabel:'EVENT', ports:['susd_rp15'] },
    { id:'susd_didrst', name:'RE_SUSD_DiagResetRequest', trigger:'event', triggerLabel:'EVENT', ports:['susd_pp15'] },
  ],
  rports: [
    { id:'susd_rp1', label:'Battery Voltage (Com)', ptype:'sr', dataType:'uint16 (raw ADC)', desc:'Analog battery voltage from CAN signal via Com module' },
    { id:'susd_rp12', label:'PMM Power Mode (Com)', ptype:'sr', dataType:'uint8 (Power Mode enum)', desc:'Primary Power Mode from Power Mode Master ECU' },
    { id:'susd_rp13', label:'BPMM Backup Power Mode', ptype:'sr', dataType:'uint8 (Power Mode enum)', desc:'Backup Power Mode Master signal for failsafe' },
    { id:'susd_rp14', label:'Run/Crank HW Input', ptype:'sr', dataType:'boolean / uint8', desc:'Hardware input for Run/Crank status, used as fail-soft fallback' },
    { id:'susd_rp16', label:'RP_TCS_SWC_Clock', ptype:'sr', dataType:'uint64 (GlobalTime)', desc:'Current ECU timestamp from TCS module' },
    { id:'susd_rp2', label:'RP_SSC_ShutdownPermission', ptype:'sr', dataType:'SUSD_UserRequestType (uint8)', desc:'Shutdown vote from SSC: 0-3=Disable(rolling), 255=Enable' },
    { id:'susd_rp3', label:'RP_SPM_ShutdownPermission', ptype:'sr', dataType:'SUSD_UserRequestType (uint8)', desc:'Shutdown vote from SPM: 254=SPM_Shutdown_Ready special value' },
    { id:'susd_rp4', label:'RP_SrvcMgr_ShutdownPermission', ptype:'sr', dataType:'SUSD_UserRequestType (uint8)', desc:'Shutdown vote from SrvcMgr' },
    { id:'susd_rp5', label:'RP_SSFM_ShutdownPermission', ptype:'sr', dataType:'SUSD_UserRequestType (uint8)', desc:'Shutdown vote from SSFM' },
    { id:'susd_rp6', label:'RP_SOH_ShutdownPermission', ptype:'sr', dataType:'SUSD_UserRequestType (uint8)', desc:'Shutdown vote from SOH' },

// =========================================================================
// RENDERING
// =========================================================================
function renderAll() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  MODULES.forEach((mod, idx) => {
    const sec = document.createElement('div');
    sec.className = 'module-section';
    sec.id = mod.id;
    const isFirst = idx === 0;
    sec.innerHTML = `
      <div class="module-title-bar${isFirst?' open':''}" onclick="toggleModule(this)">
        <div style="display:flex;align-items:center;"><span class="tag">${mod.tag}</span><h2>${mod.name}</h2></div>
        <span class="arrow">&#9654;</span>
      </div>
      <div class="module-body${isFirst?' open':''}">
        <div class="module-info"><strong>SWC:</strong> ${mod.swcName} &bull; <strong>Layer:</strong> ${mod.layer}<br>${mod.desc}</div>
        <div class="hint-bar">Click a <em>Runnable</em> to highlight its connected ports. Click a <em>Port</em> to see detailed interface info. Click again to reset.</div>
        ${mod.subgroups ? renderSubgroupTabs(mod) : ''}
        <button class="reset-filter-btn" id="reset-${mod.id}" onclick="resetFilter('${mod.id}')">Clear Filter</button>
        ${renderDiagram(mod)}
      </div>`;
    main.appendChild(sec);
  });
}

function renderDiagram(mod) {
  return `<div class="swc-diagram" data-mod="${mod.id}">
    <div class="port-col left">
      <div class="port-section-label">REQUIRED PORTS (R-Ports)</div>
      ${mod.rports.map(p => renderPort(p, 'rp', mod.id)).join('')}
    </div>
    <div class="swc-block">
      <div class="swc-block-header">${mod.swcName}</div>
      <div class="swc-block-body">
        <div class="runnables-section">
          <h4>Runnables</h4>
          ${mod.runnables.map(r => renderRunnable(r, mod.id)).join('')}
        </div>
        <div class="irv-section">
          <h4>Inter-Runnable Variables</h4>
          ${mod.irvs.map(i => `<span class="irv-item">${i}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="port-col right">
      <div class="port-section-label">PROVIDED PORTS (P-Ports)</div>
      ${mod.pports.map(p => renderPort(p, 'pp', mod.id)).join('')}
    </div>
  </div>`;
}

function renderPort(p, dir, modId) {
  const cls = p.ptype; // sr, cs, ms
  const conn = dir === 'rp' ? 'rp' : 'pp';
  const badge = `badge-${cls}`;
  const badgeLabel = cls.toUpperCase().replace('SR','S/R').replace('CS','C/S').replace('MS','MS');
  if (dir === 'rp') {
    return `<div class="port-item" data-port="${p.id}" data-mod="${modId}" onclick="showPortDetail(this,'${modId}','${p.id}')">
      <span class="port-type-badge ${badge}">${badgeLabel}</span>
      <span class="port-label ${cls}">${p.label}</span>
      <span class="port-connector ${conn}"></span>
    </div>`;
  } else {
    return `<div class="port-item" data-port="${p.id}" data-mod="${modId}" onclick="showPortDetail(this,'${modId}','${p.id}')">
      <span class="port-connector ${conn}"></span>
      <span class="port-label ${cls}">${p.label}</span>
      <span class="port-type-badge ${badge}">${badgeLabel}</span>
    </div>`;
  }
}

function renderRunnable(r, modId) {
  const tclass = r.trigger === 'periodic' ? 'trigger-periodic' :
                 r.trigger === 'init' ? 'trigger-init' :
                 r.trigger === 'event' ? 'trigger-event' : 'trigger-cs';
  const sgAttr = r.subgroup ? ` data-subgroup="${r.subgroup}"` : '';
  const sgBadge = r.subgroup && r.subgroup !== 'both'
    ? `<span class="sg-badge sg-${r.subgroup.toLowerCase()}">${r.subgroup}</span>`
    : (r.subgroup === 'both' ? `<span class="sg-badge sg-both">SSM+ERRH</span>` : '');
  const hasInfo = RUNNABLE_INFO[r.name] ? 'true' : 'false';
  return `<div class="runnable-item" data-runnable="${r.id}" data-mod="${modId}" data-ports="${r.ports.join(',')}"${sgAttr} onclick="filterByRunnable(this,'${modId}','${r.id}')">
    <span class="runnable-name">${r.name}</span>
    ${sgBadge}
    <span class="runnable-trigger ${tclass}">${r.triggerLabel}</span>
    <button class="runnable-info-btn" data-rname="${r.name}" onclick="event.stopPropagation();showRunnableInfo('${r.name.replace(/'/g,"\\'")}')" title="AUTOSAR runnable details" style="${hasInfo==='false'?'opacity:0.35;pointer-events:none':''}">!</button>
  </div>`;
}

// =========================================================================
// INTERACTION: Click Runnable -> Highlight Ports
// =========================================================================
let activeRunnable = {};

function filterByRunnable(el, modId, runnableId) {
  const diagram = document.querySelector(`.swc-diagram[data-mod="${modId}"]`);
  if (!diagram) return;
  const allPorts = diagram.querySelectorAll('.port-item');
  const allRunnables = diagram.querySelectorAll('.runnable-item');
  const resetBtn = document.getElementById('reset-' + modId);

  // Toggle off if same runnable clicked -> revert to subgroup filter if active
  if (activeRunnable[modId] === runnableId) {
    delete activeRunnable[modId];
    resetBtn.classList.remove('show');
    if (activeSubgroup[modId]) {
      reapplySubgroupFilter(modId);
    } else {
      allPorts.forEach(p => p.classList.remove('highlighted','dimmed'));
      allRunnables.forEach(r => r.classList.remove('active','dimmed'));
    }
    return;
  }
  activeRunnable[modId] = runnableId;

  // Get port list for this runnable
  const portList = el.dataset.ports ? el.dataset.ports.split(',') : [];

  // Dim all, highlight connected
  allPorts.forEach(p => {
    p.classList.remove('highlighted','dimmed');
    if (portList.includes(p.dataset.port)) {
      p.classList.add('highlighted');
    } else {
      p.classList.add('dimmed');
    }
  });
  allRunnables.forEach(r => {
    r.classList.remove('active','dimmed');
    if (r.dataset.runnable === runnableId) {
      r.classList.add('active');
    } else {
      r.classList.add('dimmed');
    }
  });
  resetBtn.classList.add('show');
}

function reapplySubgroupFilter(modId) {
  const sg = activeSubgroup[modId];
  if (!sg) return;
  const diagram = document.querySelector(`.swc-diagram[data-mod="${modId}"]`);
  if (!diagram) return;
  const allRunnables = diagram.querySelectorAll('.runnable-item');
  const allPorts = diagram.querySelectorAll('.port-item');
  const visiblePortIds = new Set();
  allRunnables.forEach(r => {
    r.classList.remove('active','highlighted');
    const rsg = r.dataset.subgroup;
    if (rsg === sg || rsg === 'both') {
      r.classList.remove('dimmed');
      const ports = r.dataset.ports ? r.dataset.ports.split(',') : [];
      ports.forEach(pid => visiblePortIds.add(pid));
    } else {
      r.classList.add('dimmed');
    }
  });
  allPorts.forEach(p => {
    p.classList.remove('highlighted');
    if (visiblePortIds.has(p.dataset.port)) {
      p.classList.remove('dimmed');
    } else {
      p.classList.add('dimmed');
    }
  });
}

function resetFilter(modId) {
  const diagram = document.querySelector(`.swc-diagram[data-mod="${modId}"]`);
  if (!diagram) return;
  diagram.querySelectorAll('.port-item').forEach(p => p.classList.remove('highlighted','dimmed'));
  diagram.querySelectorAll('.runnable-item').forEach(r => r.classList.remove('active','dimmed'));
  document.getElementById('reset-' + modId).classList.remove('show');
  delete activeRunnable[modId];
}

// =========================================================================
// INTERACTION: Click Port -> Show Detail Panel
// =========================================================================
function showPortDetail(el, modId, portId) {
  const mod = MODULES.find(m => m.id === modId);
  if (!mod) return;
  let port = mod.rports.find(p => p.id === portId);
  let dir = 'Required (R-Port)';
  let dirTag = 'rp-tag';
  if (!port) {
    port = mod.pports.find(p => p.id === portId);
    dir = 'Provided (P-Port)';
    dirTag = 'pp-tag';
  }
  if (!port) return;

  const ptypeLabel = port.ptype === 'sr' ? 'Sender-Receiver' : port.ptype === 'cs' ? 'Client-Server' : 'Mode-Switch';
  const ptypeTag = port.ptype + '-tag';
  const headerClass = port.ptype + '-header';

  // Find which runnables use this port
  const linkedRunnables = mod.runnables.filter(r => r.ports.includes(portId));

  const header = document.getElementById('detailHeader');
  header.className = 'detail-panel-header ' + headerClass;
  document.getElementById('detailTitle').textContent = port.label;

  let html = `
    <div class="detail-row"><div class="detail-label">Direction</div><div class="detail-value"><span class="detail-tag ${dirTag}">${dir}</span></div></div>
    <div class="detail-row"><div class="detail-label">Interface</div><div class="detail-value"><span class="detail-tag ${ptypeTag}">${ptypeLabel}</span></div></div>
    <div class="detail-row"><div class="detail-label">Data Type</div><div class="detail-value">${port.dataType}</div></div>
    <div class="detail-row"><div class="detail-label">Description</div><div class="detail-value">${port.desc}</div></div>
    <div class="detail-row"><div class="detail-label">Module</div><div class="detail-value">${mod.swcName} (${mod.tag})</div></div>`;

  if (linkedRunnables.length > 0) {
    html += `<div class="detail-row"><div class="detail-label">Used By</div><div class="detail-value"><div class="detail-runnables-list">
      ${linkedRunnables.map(r => `<span class="mini-runnable">${r.name} [${r.triggerLabel}]</span>`).join('')}
    </div></div></div>`;
  }

  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail(e) {
  if (e && e.target !== document.getElementById('detailOverlay')) return;
  document.getElementById('detailOverlay').classList.remove('show');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

// =========================================================================
// SUBGROUP TAB FILTER (SSM / ERRH)
// =========================================================================
let activeSubgroup = {};

function renderSubgroupTabs(mod) {
  const counts = {};
  mod.subgroups.forEach(sg => {
    if (sg === 'All') { counts[sg] = mod.runnables.length; }
    else { counts[sg] = mod.runnables.filter(r => r.subgroup === sg || r.subgroup === 'both').length; }
  });
  return `<div class="subgroup-tabs" data-mod="${mod.id}">
    ${mod.subgroups.map((sg, i) =>
      `<button class="subgroup-tab${i===0?' active':''}" data-sg="${sg}" onclick="filterBySubgroup('${mod.id}','${sg}',this)">${sg}<span class="tab-badge">${counts[sg]}</span></button>`
    ).join('')}
  </div>`;
}

function filterBySubgroup(modId, sg, tabEl) {
  // Update active tab
  const tabBar = tabEl.parentElement;
  tabBar.querySelectorAll('.subgroup-tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');

  // Reset any runnable filter first
  resetFilter(modId);

  const diagram = document.querySelector(`.swc-diagram[data-mod="${modId}"]`);
  if (!diagram) return;

  const allRunnables = diagram.querySelectorAll('.runnable-item');
  const allPorts = diagram.querySelectorAll('.port-item');

  if (sg === 'All') {
    // Show everything
    allRunnables.forEach(r => r.classList.remove('dimmed','hidden-sg'));
    allPorts.forEach(p => p.classList.remove('dimmed','hidden-sg'));
    delete activeSubgroup[modId];
    return;
  }

  activeSubgroup[modId] = sg;

  // Find runnables matching this subgroup (or 'both')
  const visibleRunnables = [];
  const visiblePortIds = new Set();
  allRunnables.forEach(r => {
    const rsg = r.dataset.subgroup;
    if (rsg === sg || rsg === 'both') {
      r.classList.remove('dimmed','hidden-sg');
      visibleRunnables.push(r);
      // Collect ports
      const ports = r.dataset.ports ? r.dataset.ports.split(',') : [];
      ports.forEach(pid => visiblePortIds.add(pid));
    } else {
      r.classList.add('dimmed');
    }
  });

  // Dim ports not connected to visible runnables
  allPorts.forEach(p => {
    if (visiblePortIds.has(p.dataset.port)) {
      p.classList.remove('dimmed');
    } else {
      p.classList.add('dimmed');
    }
  });
}

// =========================================================================
// MODULE TOGGLE & NAV
// =========================================================================
function toggleModule(bar) {
  bar.classList.toggle('open');
  bar.nextElementSibling.classList.toggle('open');
}

(function buildNav() {
  const nav = document.getElementById('navBar');
  const expandBtn = document.createElement('button');
  expandBtn.className = 'nav-btn'; expandBtn.textContent = 'Expand All';
  expandBtn.style.background = 'rgba(230,126,34,0.3)';
  expandBtn.onclick = () => document.querySelectorAll('.module-title-bar').forEach(b => { b.classList.add('open'); b.nextElementSibling.classList.add('open'); });
  nav.appendChild(expandBtn);
  const collapseBtn = document.createElement('button');
  collapseBtn.className = 'nav-btn'; collapseBtn.textContent = 'Collapse All';
  collapseBtn.onclick = () => document.querySelectorAll('.module-title-bar').forEach(b => { b.classList.remove('open'); b.nextElementSibling.classList.remove('open'); });
  nav.appendChild(collapseBtn);
  const sep = document.createElement('div');
  sep.style.cssText = 'width:1px;height:24px;background:rgba(255,255,255,0.15);margin:0 4px;';
  nav.appendChild(sep);
  MODULES.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn'; btn.textContent = m.tag;
    btn.onclick = function() {
      const el = document.getElementById(m.id);
      const bar = el.querySelector('.module-title-bar');
      if (!bar.classList.contains('open')) { bar.classList.add('open'); bar.nextElementSibling.classList.add('open'); }
      el.scrollIntoView({ behavior:'smooth', block:'start' });
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    nav.appendChild(btn);
  });
})();

// =========================================================================
// RUNNABLE INFO POPUP LOGIC
// =========================================================================
function showRunnableInfo(rName) {
  const r = RUNNABLE_INFO[rName];
  if (!r) return;
  document.getElementById('riTitle').textContent = rName;

  const BADGES = {
    "TIMING-EVENT":'<span class="ri-badge ri-b-timing">TIMING-EVENT</span>',
    "DATA-RECEIVED-EVENT":'<span class="ri-badge ri-b-datarcv">DATA-RECEIVED-EVENT</span>',
    "OPERATION-INVOKED-EVENT":'<span class="ri-badge ri-b-opinvoke">OPERATION-INVOKED-EVENT</span>',
    "SWC-MODE-SWITCH-EVENT":'<span class="ri-badge ri-b-mode">SWC-MODE-SWITCH-EVENT</span>',
    "INIT-EVENT":'<span class="ri-badge ri-b-init">INIT-EVENT</span>'
  };
  function fmtList(arr) {
    if (!arr || arr.length === 0) return '<em style="color:#94a3b8">None</em>';
    return '<ul>' + arr.map(s => '<li><code>' + s + '</code></li>').join('') + '</ul>';
  }
  let rows = '';
  rows += '<tr><th>C Symbol</th><td><code>' + r.symbol + '</code></td></tr>';
  rows += '<tr><th>Trigger</th><td>' + (BADGES[r.trigger] || r.trigger) + '</td></tr>';
  rows += '<tr><th>Period</th><td>' + r.period + '</td></tr>';
  if (r.reads) rows += '<tr><th>Ports Read</th><td>' + fmtList(r.reads) + '</td></tr>';
  if (r.writes) rows += '<tr><th>Ports Written</th><td>' + fmtList(r.writes) + '</td></tr>';
  if (r.serverCalls) rows += '<tr><th>Server Calls</th><td>' + fmtList(r.serverCalls) + '</td></tr>';
  if (r.modeAccess) rows += '<tr><th>Mode Access</th><td>' + fmtList(r.modeAccess) + '</td></tr>';
  if (r.modeSwitch) rows += '<tr><th>Mode Switch</th><td>' + fmtList(r.modeSwitch) + '</td></tr>';
  if (r.params) rows += '<tr><th>Parameters</th><td>' + fmtList(r.params) + '</td></tr>';
  if (r.exclusiveAreas) rows += '<tr><th>Exclusive Areas</th><td>' + fmtList(r.exclusiveAreas) + '</td></tr>';
  rows += '<tr><th>Concurrent</th><td>' + (r.concurrent ? 'Yes' : 'No') + '</td></tr>';
  rows += '<tr><th>Description</th><td>' + r.desc + '</td></tr>';

  document.getElementById('riBody').innerHTML = '<table>' + rows + '</table>';
  document.getElementById('riOverlay').classList.add('show');
}

(function() {
  const ov = document.getElementById('riOverlay');
  ov.addEventListener('click', function(e) { if (e.target === ov) ov.classList.remove('show'); });
  document.getElementById('riClose').addEventListener('click', function() { ov.classList.remove('show'); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') ov.classList.remove('show'); });
})();

renderAll();
</script>
